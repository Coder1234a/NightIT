# Render Blueprint. This file MUST sit at the repository root - Render does not
# look inside subfolders for it.
#
# In Render: New > Blueprint > pick this repo. It creates the web service and a
# free PostgreSQL database and wires DATABASE_URL between them automatically.
services:
  - type: web
    name: nightit-api
    runtime: node
    rootDir: server            # the code lives here; render.yaml does not
    plan: free
    buildCommand: npm ci && npm run migrate -- --seed-if-empty
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nightit-db
          property: connectionString
      # Pins the app clock so a 6 AM demo still shows an open mess.
      # Set it to 23:00 in the Render dashboard before judging. Leave it blank
      # the rest of the time so the real clock is used.
      - key: DEMO_TIME
        sync: false

databases:
  - name: nightit-db
    databaseName: nightit
    plan: free

# NOTE on --seed-if-empty: the seed file starts with TRUNCATE, so a plain
# --seed here would erase the night's real orders on every deploy.
# --seed-if-empty only seeds when the blocks table is empty, which is true
# exactly once: on the very first deploy. Every deploy after that skips it.
# Never change this to --seed.
