# Render Blueprint. Must sit at the repository root.
# In Render: New > Blueprint > pick this repo. It creates the API, the database
# and the static frontend, and wires them together.
services:
  - type: web
    name: nightit-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run migrate -- --seed-if-empty
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: nightit-db, property: connectionString }
      # Pins the app clock so an off-hours demo still shows an open mess.
      # Set it to 23:00 for judging; leave it blank in real use.
      - key: DEMO_TIME
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: nightit-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # A plain value on purpose. fromService hands over a bare hostname with no
      # scheme, and a blueprint that cannot resolve it fails silently.
      - key: VITE_API_URL
        value: https://nightit-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nightit-db
    databaseName: nightit
    plan: free

# --seed-if-empty only seeds when the blocks table is empty, which is true
# exactly once. Never change it to --seed: the seed truncates every table, so
# every deploy would erase the night's real orders.
